responses_create_params:
  temperature: 1.0
  top_p: 0.95

workplace_assistant:
  resources_servers:
    workplace_assistant:
      entrypoint: app.py
      domain: agent
      verified: false
      description: Workplace assistant multi-step tool-using environment.
      value: Improve multi-step tool use capability.

policy_model:
  responses_api_models:
    openai_model:
      entrypoint: app.py
      openai_base_url: https://openrouter.ai/api/v1
      openai_api_key: ${policy_api_key}
      openai_model: deepseek/deepseek-v4-flash-0731
      extra_body:
        reasoning:
          effort: max

workplace_assistant_decomposer_agent:
  responses_api_agents:
    decomposer_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: workplace_assistant
      model_server:
        type: responses_api_models
        name: policy_model
      join_gym_system_and_user_prompts: true
      response_for_verifier_factory: responses_api_agents.decomposer_agent.app:_subagent_tool_calls_and_final_message
      subagent_types:
        - subagent_type_id: qwen_3_5_4b_non_thinking
          assistant_id: qwen_3_5_4b_non_thinking
          url: http://127.0.0.1:2024
          description: Tool-calling agent based on a Qwen3.5-4B non-thinking model. Has access to all the workplace tools.
      datasets:
        - name: train
          type: train
          jsonl_fpath: resources_servers/workplace_assistant/data/train.jsonl
          huggingface_identifier:
            repo_id: nvidia/Nemotron-RL-agent-workplace_assistant
            artifact_fpath: train.jsonl
          license: Apache 2.0
        - name: validation
          type: validation
          jsonl_fpath: resources_servers/workplace_assistant/data/validation.jsonl
          huggingface_identifier:
            repo_id: nvidia/Nemotron-RL-agent-workplace_assistant
            artifact_fpath: validation.jsonl
          license: Apache 2.0
        - name: example
          type: example
          jsonl_fpath: resources_servers/workplace_assistant/data/example.jsonl
