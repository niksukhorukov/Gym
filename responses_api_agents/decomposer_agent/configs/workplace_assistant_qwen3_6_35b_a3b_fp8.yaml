responses_create_params:
  temperature: 1.0
  top_p: 0.95

workplace_assistant:
  resources_servers:
    workplace_assistant:
      entrypoint: app.py
      domain: agent
      verified: false
      description: Workplace assistant multi-step tool-using environment.
      value: Improve multi-step tool use capability.

policy_model:
  responses_api_models:
    vllm_model:
      entrypoint: app.py
      base_url: http://127.0.0.1:8019/v1
      api_key: EMPTY
      model: Qwen/Qwen3.6-35B-A3B-FP8
      return_token_id_information: false
      uses_reasoning_parser: true
      chat_template_kwargs:
        enable_thinking: true
        preserve_thinking: true
      extra_body:
        top_k: 20
        min_p: 0.0
        presence_penalty: 1.5
        repetition_penalty: 1.0

workplace_assistant_decomposer_agent:
  responses_api_agents:
    decomposer_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: workplace_assistant
      model_server:
        type: responses_api_models
        name: policy_model
      join_gym_system_and_user_prompts: true
      response_for_verifier_factory: responses_api_agents.decomposer_agent.app:_subagent_tool_calls_and_final_message
      subagent_types:
        - subagent_type_id: tiny_thinking
          assistant_id: gemma_4_2b_thinking
          url: http://127.0.0.1:2024
          description: Tool-calling agent based on a tiny thinking model. Has access to all the workplace tools.
        - subagent_type_id: tiny_non_thinking
          assistant_id: gemma_4_2b_non_thinking
          url: http://127.0.0.1:2024
          description: Tool-calling agent based on a tiny non-thinking model. Has access to all the workplace tools.
        - subagent_type_id: small_thinking
          assistant_id: gemma_4_4b_thinking
          url: http://127.0.0.1:2024
          description: Tool-calling agent based on a small thinking model. Has access to all the workplace tools.
        - subagent_type_id: small_non_thinking
          assistant_id: gemma_4_4b_non_thinking
          url: http://127.0.0.1:2024
          description: Tool-calling agent based on a small non-thinking model. Has access to all the workplace tools.
        - subagent_type_id: medium_thinking
          assistant_id: gemma_4_12b_thinking
          url: http://127.0.0.1:2024
          description: Tool-calling agent based on a medium thinking model. Has access to all the workplace tools.
        - subagent_type_id: medium_non_thinking
          assistant_id: gemma_4_12b_non_thinking
          url: http://127.0.0.1:2024
          description: Tool-calling agent based on a medium non-thinking model. Has access to all the workplace tools.
        - subagent_type_id: large_thinking
          assistant_id: gemma_4_26b_a4b_thinking
          url: http://127.0.0.1:2024
          description: Tool-calling agent based on a large thinking model. Has access to all the workplace tools.
        - subagent_type_id: large_non_thinking
          assistant_id: gemma_4_26b_a4b_non_thinking
          url: http://127.0.0.1:2024
          description: Tool-calling agent based on a large non-thinking model. Has access to all the workplace tools.
      datasets:
        - name: train
          type: train
          jsonl_fpath: resources_servers/workplace_assistant/data/train.jsonl
          huggingface_identifier:
            repo_id: nvidia/Nemotron-RL-agent-workplace_assistant
            artifact_fpath: train.jsonl
          license: Apache 2.0
        - name: validation
          type: validation
          jsonl_fpath: resources_servers/workplace_assistant/data/validation.jsonl
          huggingface_identifier:
            repo_id: nvidia/Nemotron-RL-agent-workplace_assistant
            artifact_fpath: validation.jsonl
          license: Apache 2.0
        - name: example
          type: example
          jsonl_fpath: resources_servers/workplace_assistant/data/example.jsonl
